name: Publish v1

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v1.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the v1 source
        uses: actions/checkout@v4
        with:
          ref: 0a21c78e3f21ed98ead31d1943d8db541d7335b6

      - name: Build release package
        shell: bash
        run: |
          set -euo pipefail
          package_dir="Vencord-Auto-Install-v1"
          mkdir -p "$package_dir"
          cp "Install Vencord Hidden.vbs" "$package_dir/"
          cp "Install-Vencord-All.ps1" "$package_dir/"
          cp "Startup.vbs" "$package_dir/"
          cp "Startup-Manager.hta" "$package_dir/"
          cp "README.md" "$package_dir/"
          cp "LICENSE" "$package_dir/"
          cp -R "assets" "$package_dir/"
          zip -9 -r "Vencord-Auto-Install-v1.zip" "$package_dir"
          sha256sum "Vencord-Auto-Install-v1.zip" > "Vencord-Auto-Install-v1.zip.sha256"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          ## Vencord Auto Install v1

          The first public release of Vencord Auto Install.

          ### Highlights

          - Detects Discord Stable, Canary, and PTB automatically.
          - Downloads the official Vencord Installer and verifies its SHA-256 checksum.
          - Runs two sequential install/repair passes for every detected Discord version.
          - Fully silent execution with no CMD or PowerShell window.
          - Fast dark Startup Manager with Add and Remove controls.
          - Waits for internet access before automatic startup installation.
          - Optional Discord launch selections, unchecked by default.

          ### Installation

          1. Download `Vencord-Auto-Install-v1.zip`.
          2. Extract the ZIP file.
          3. Double-click `Install Vencord Hidden.vbs` for a one-time install, or open `Startup.vbs` to configure automatic startup.

          > Vencord is an unofficial Discord modification. Use it at your own risk.
          EOF

          gh release create v1 \
            "Vencord-Auto-Install-v1.zip" \
            "Vencord-Auto-Install-v1.zip.sha256" \
            --repo "KLAW-G/Vencord-Auto-Install" \
            --target "0a21c78e3f21ed98ead31d1943d8db541d7335b6" \
            --title "Vencord Auto Install v1" \
            --notes-file release-notes.md